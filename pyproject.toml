[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent"
version = "0.1.0"
description = "HARNESS: Autonomous agent harness with decoupled core, tools, permissions, and session management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "HARNESS Team" }
]
keywords = ["agent", "harness", "llm", "clean-architecture"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.9.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=harness_agent --cov-report=term-missing"

[tool.coverage.run]
source = ["src/harness_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.setuptools.package-data]
harness_agent = ["py.typed"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".claude",
    ".specify",
    ".agents",
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
