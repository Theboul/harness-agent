# Plantilla de configuración de HARNESS.
#
# Copie este archivo a "config.toml" (que Git ignora) y ajuste los valores. HARNESS lo busca en el
# directorio de trabajo; otra ubicación se indica con la variable de entorno HARNESS_CONFIG.
#
# Este archivo NO lleva claves de API: las claves se definen solo en variables de entorno
# (vea .env.example). Un campo con aspecto de clave o de secreto se rechaza al arrancar.

# Modelo en uso, con la forma <proveedor>/<modelo>. Proveedores admitidos: anthropic, fake, gemini,
# groq, ollama, openai y openrouter.
# "fake/test" es el proveedor simulado: no necesita clave ni red. "ollama/..." usa un servidor local
# y tampoco necesita clave.
model = "fake/test"

[limits]
# Máximo de turnos del bucle del agente por ejecución (entero mayor que 0).
max_turns = 30
# Máximo de segundos de una ejecución (entero mayor que 0).
max_seconds = 600
# Máximo de tokens de una ejecución (entero mayor que 0).
max_tokens = 200000
# Máximo de tokens que el modelo puede generar en UNA llamada (entero mayor que 0; por defecto 4096,
# válido también para proveedores de tope bajo). No es lo mismo que max_tokens, que es el
# presupuesto de toda la ejecución. Descomente y ajuste la línea para cambiarlo.
# max_output_tokens = 4096
# Máximo de caracteres del resultado de UNA herramienta que vuelve al modelo (entero de al menos 256;
# por defecto 24000). Si lo supera, se conservan el principio y el final y se marca cuántos caracteres
# se omitieron. Descomente y ajuste la línea para cambiarlo.
# max_tool_output_chars = 24000

[paths]
# Ruta de la base de datos de sesiones. Una ruta relativa se interpreta respecto a la carpeta de
# este archivo, no respecto al directorio de trabajo.
sessions_db = ".harness/sessions.db"
# Raíz del área de trabajo autorizada (misma regla para rutas relativas). Si no se define, no hay
# área autorizada y las escrituras se deniegan: descomente y ajuste la línea para autorizar una.
# workspace_root = "."

# Reglas de permisos (opcional). Sin esta sección rigen solo las reglas integradas: nada se permite
# salvo escribir (y leer) dentro del área autorizada. Las listas solo pueden endurecer la política:
# no existen reglas de permitir en la configuración y un campo desconocido detiene el arranque.
# Los nombres son los de las herramientas, tal cual (distinguen mayúsculas).
# [permissions]
# Herramientas que siempre se deniegan (prevalece sobre las demás reglas).
# deny = []
# Herramientas que siempre se preguntan (hoy, sin interfaz de aprobación, se deniegan con motivo).
# ask = []
# Comandos del shell que se añaden a la lista base de denegados de la plataforma. Solo añaden
# comandos: la lista base no se puede quitar ni vaciar. Se escriben como el comando real
# (por ejemplo "terraform destroy").
# deny_commands = []

# Servidores MCP por stdio (opcional; requiere el extra "mcp": pip install ".[mcp]"). Un servidor por
# tabla [mcp_servers.<nombre>]. Si uno no arranca, el arnés inicia igualmente, avisa y lo deja sin
# herramientas. El servidor NO hereda el entorno del arnés: "env" lista NOMBRES de variables que sí
# recibe (nunca valores ni claves en este archivo). Los tiempos son segundos (por defecto 15 y 60).
# [mcp_servers.demo]
# command = "python"
# args = ["tests/spikes/mcp_demo_server.py"]
# env = []
# startup_timeout_s = 15
# call_timeout_s = 60

# Compactación automática del contexto (opcional). Sin esta sección rigen los valores de abajo. Si el
# contexto estimado supera el umbral del modelo, al empezar una petición se resume lo antiguo y se
# conserva íntegro lo reciente; el historial original no se borra. Cada valor es un entero y uno
# inválido detiene el arranque. Los números de ejemplo son valores por defecto, no una promesa del
# tamaño real de ningún modelo: ajústelos al modelo que use.
# [context]
# Ventana de un modelo que no aparece en [context.windows] (de 1000 a 10000000 tokens).
# window_tokens = 32000
# El umbral es este porcentaje de la ventana (de 10 a 95).
# threshold_percent = 80
# Los mensajes recientes que se conservan suman como mucho este porcentaje del umbral (de 5 a 60).
# recent_percent = 30
# Y nunca son menos de estos mensajes (de 1 a 50).
# min_recent_messages = 4
# Tamaño pedido al resumen, en tokens (de 100 a 8000); se acepta hasta el doble.
# summary_tokens = 2000
# Ventana de cada modelo por su nombre completo, entre comillas (de 1000 a 10000000 tokens).
# [context.windows]
# "openai/gpt-4o" = 128000
